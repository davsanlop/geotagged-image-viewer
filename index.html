<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de Inspecciones GeoEXIF Avanzado</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- FontAwesome para Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Proj4js para conversión UTM -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    
    <!-- Tailwind CSS para Estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Exifr JS para extraer metadatos EXIF en cliente -->
    <script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>

    <style>
        /* Estilos personalizados del mapa y animaciones */
        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Marcadores interactivos con Azimut limpio */
        .custom-marker {
            transition: all 0.25s ease;
        }
        .custom-marker-arrow-wrapper {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.25s ease;
        }
        .custom-marker-arrow-inner {
            font-size: 26px;
            color: #ffffff;
            filter: drop-shadow(0 0 2px #0284c7) drop-shadow(0 0 2px #0284c7);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .custom-marker.active .custom-marker-arrow-inner,
        .custom-marker:hover .custom-marker-arrow-inner {
            transform: scale(1.25);
            filter: drop-shadow(0 0 3px #f59e0b) drop-shadow(0 0 3px #f59e0b);
            z-index: 1000 !important;
        }

        /* Scrollbar personalizado */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Animación suave para la lista */
        .item-card {
            transition: all 0.2s ease;
        }
        .item-card.highlighted {
            border-color: #f59e0b;
            background-color: #fffbeb;
            transform: translateX(4px);
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- PANEL LATERAL (SIDEBAR) -->
    <aside class="w-full md:w-96 bg-white flex flex-col h-1/2 md:h-full border-r border-slate-200 shadow-xl z-20">
        
        <!-- Header Principal -->
        <div class="p-4 bg-brand-900 text-white flex items-center justify-between shadow-md">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-map-location-dot text-brand-500 text-2xl"></i>
                <div>
                    <h1 class="font-bold text-base leading-tight">Visor GeoEXIF</h1>
                    <p class="text-xs text-slate-300">Inspecciones de Campo</p>
                </div>
            </div>
            <span id="counter-badge" class="bg-brand-700 text-brand-100 text-xs font-semibold px-2.5 py-1 rounded-full">
                0 fotos
            </span>
        </div>

        <!-- Zona Drag & Drop -->
        <div class="p-3 bg-slate-50 border-b border-slate-200">
            <div id="drop-zone" class="border-2 border-dashed border-brand-500 hover:border-brand-600 bg-brand-50/50 hover:bg-brand-50 transition-all rounded-xl p-4 text-center cursor-pointer group">
                <input type="file" id="file-input" multiple accept="image/jpeg, image/jpg" class="hidden">
                <i class="fa-solid fa-cloud-arrow-up text-3xl text-brand-500 group-hover:scale-110 transition-transform mb-1"></i>
                <p class="text-xs font-semibold text-slate-700">Arrastra fotos JPG/JPEG aquí</p>
                <p class="text-[10px] text-slate-500 mt-0.5">o haz clic para explorar en tu equipo</p>
            </div>
        </div>

        <!-- Filtros y Búsqueda -->
        <div class="p-3 bg-white border-b border-slate-200 flex items-center gap-1.5 flex-wrap">
            <div class="relative flex-1 min-w-[120px]">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                <input type="text" id="search-input" placeholder="Buscar..." 
                       class="w-full pl-8 pr-2 py-1.5 text-xs bg-slate-100 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 transition">
            </div>
            <button id="btn-export-geojson" title="Exportar GeoJSON" disabled
                    class="px-2 py-1.5 bg-slate-100 hover:bg-brand-500 hover:text-white text-slate-600 rounded-lg text-xs font-medium transition disabled:opacity-40 disabled:pointer-events-none flex items-center gap-1">
                <i class="fa-solid fa-download"></i> GeoJSON
            </button>
            <button id="btn-export-dxf" title="Exportar DXF AutoCAD" disabled
                    class="px-2 py-1.5 bg-slate-100 hover:bg-brand-600 hover:text-white text-slate-600 rounded-lg text-xs font-medium transition disabled:opacity-40 disabled:pointer-events-none flex items-center gap-1">
                <i class="fa-solid fa-file-code"></i> DXF
            </button>
            <button id="btn-reset" title="Limpiar todo" disabled
                    class="px-2 py-1.5 bg-slate-100 hover:bg-red-500 hover:text-white text-slate-600 rounded-lg text-xs font-medium transition disabled:opacity-40 disabled:pointer-events-none">
                <i class="fa-solid fa-trash-can"></i>
            </button>
        </div>

        <!-- Lista de Fotografías Cargadas -->
        <div id="items-container" class="flex-1 overflow-y-auto p-3 space-y-2">
            <!-- Estado inicial vacío -->
            <div id="empty-state" class="h-full flex flex-col items-center justify-center text-center p-6 text-slate-400">
                <i class="fa-regular fa-images text-4xl mb-3 text-slate-300"></i>
                <p class="text-xs font-medium">No hay fotografías cargadas</p>
                <p class="text-[11px] mt-1 text-slate-400">Arrastra archivos para procesar automáticamente sus coordenadas GPS.</p>
            </div>
        </div>

        <!-- Footer / Logs -->
        <div class="px-3 py-2 bg-slate-100 border-t border-slate-200 text-[10px] text-slate-500 flex justify-between items-center">
            <span id="status-text">Listo para cargar</span>
            <span id="gps-stats">0 con GPS</span>
        </div>
    </aside>

    <!-- MAPA PRINCIPAL -->
    <main class="flex-1 relative h-1/2 md:h-full">
        <div id="map"></div>

        <!-- Botón Flotante para recentrar mapa -->
        <button id="btn-center-map" class="absolute bottom-5 right-5 z-[1000] bg-white text-slate-700 hover:text-brand-600 p-3 rounded-full shadow-lg border border-slate-200 transition hover:scale-105 active:scale-95 flex items-center justify-center">
            <i class="fa-solid fa-crosshairs text-lg"></i>
        </button>
    </main>

    <!-- LIGHTBOX / VISOR A PANTALLA COMPLETA -->
    <div id="lightbox" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-[2000] hidden flex-col justify-between p-4 transition-opacity duration-300 opacity-0">
        <!-- Header Lightbox -->
        <div class="flex justify-between items-center text-white z-10">
            <div>
                <h3 id="lightbox-title" class="font-bold text-sm sm:text-base truncate max-w-xs sm:max-w-md">Nombre de la Foto</h3>
                <p id="lightbox-sub" class="text-xs text-slate-300">Fecha y coordenadas</p>
            </div>
            <div class="flex items-center gap-2">
                <!-- Controles de Lupa / Zoom Lightbox -->
                <div class="flex items-center bg-white/10 rounded-full px-2 py-1 gap-2 mr-2">
                    <button id="lb-zoom-out" title="Reducir Zoom" class="px-2 py-0.5 hover:bg-white/20 rounded text-sm transition"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
                    <span id="lb-zoom-level" class="text-xs font-mono w-10 text-center">100%</span>
                    <button id="lb-zoom-in" title="Ampliar Zoom" class="px-2 py-0.5 hover:bg-white/20 rounded text-sm transition"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
                    <button id="lb-zoom-reset" title="Restaurar Zoom" class="px-2 py-0.5 hover:bg-white/20 rounded text-xs transition"><i class="fa-solid fa-rotate-right"></i></button>
                </div>
                <button id="lightbox-prev" class="p-2 hover:bg-white/20 rounded-full text-white transition"><i class="fa-solid fa-chevron-left text-xl"></i></button>
                <button id="lightbox-next" class="p-2 hover:bg-white/20 rounded-full text-white transition"><i class="fa-solid fa-chevron-right text-xl"></i></button>
                <button id="lightbox-close" class="p-2 hover:bg-red-500/80 rounded-full text-white transition ml-4"><i class="fa-solid fa-xmark text-2xl"></i></button>
            </div>
        </div>

        <!-- Imagen principal con soporte de zoom y arrastre -->
        <div id="lightbox-container" class="flex-1 flex items-center justify-center overflow-hidden my-2 relative cursor-grab active:cursor-grabbing">
            <img id="lightbox-img" src="" alt="Previsualización" class="max-h-[85vh] max-w-[90vw] object-contain rounded-lg shadow-2xl transition-transform duration-100 origin-center select-none">
        </div>

        <!-- Footer Lightbox -->
        <div class="text-center text-xs text-slate-400 py-1">
            <span id="lightbox-index">1 / 1</span>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // --- ESTADO GLOBAL DE LA APLICACIÓN ---
        let photosData = []; 
        let markersGroup = L.featureGroup(); 
        let activePhotoId = null;
        let currentLightboxIndex = 0;

        // Variables de Zoom para Lightbox
        let lbScale = 1;
        let lbPosX = 0;
        let lbPosY = 0;
        let isDragging = false;
        let startX = 0, startY = 0;

        // --- INICIALIZACIÓN DE CAPAS Y MAPA (Hasta Zoom 22) ---
        const topoLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 22,
            maxNativeZoom: 19,
            attribution: '© OpenStreetMap'
        });

        const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 22,
            maxNativeZoom: 19,
            attribution: 'Tiles &copy; Esri'
        });

        const map = L.map('map', {
            zoomControl: false,
            maxZoom: 22,
            layers: [topoLayer]
        }).setView([40.4168, -3.7038], 6);

        L.control.zoom({ position: 'topright' }).addTo(map);

        const baseMaps = {
            "Topográfico": topoLayer,
            "Satélite": satelliteLayer
        };
        L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);

        markersGroup.addTo(map);

        // --- ELEMENTOS DEL DOM ---
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const itemsContainer = document.getElementById('items-container');
        const emptyState = document.getElementById('empty-state');
        const searchInput = document.getElementById('search-input');
        const counterBadge = document.getElementById('counter-badge');
        const statusText = document.getElementById('status-text');
        const gpsStats = document.getElementById('gps-stats');
        const btnExportGeoJSON = document.getElementById('btn-export-geojson');
        const btnExportDXF = document.getElementById('btn-export-dxf');
        const btnReset = document.getElementById('btn-reset');
        const btnCenterMap = document.getElementById('btn-center-map');

        // Lightbox DOM
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxContainer = document.getElementById('lightbox-container');
        const lightboxTitle = document.getElementById('lightbox-title');
        const lightboxSub = document.getElementById('lightbox-sub');
        const lightboxIndex = document.getElementById('lightbox-index');
        const lightboxClose = document.getElementById('lightbox-close');
        const lightboxPrev = document.getElementById('lightbox-prev');
        const lightboxNext = document.getElementById('lightbox-next');
        const lbZoomIn = document.getElementById('lb-zoom-in');
        const lbZoomOut = document.getElementById('lb-zoom-out');
        const lbZoomReset = document.getElementById('lb-zoom-reset');
        const lbZoomLevel = document.getElementById('lb-zoom-level');

        // --- GESTIÓN DE EVENTOS DE DRAG & DROP ---
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('bg-brand-100'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('bg-brand-100'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('bg-brand-100');
            if (e.dataTransfer.files.length) processFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) processFiles(e.target.files);
        });

        // --- PROCESAMIENTO DE ARCHIVOS (Omitir duplicados) ---
        async function processFiles(files) {
            statusText.innerText = 'Procesando imágenes...';
            let addedCount = 0;
            let skippedCount = 0;

            for (let file of files) {
                if (!file.type.match('image/jpeg') && !file.name.match(/\.(jpg|jpeg)$/i)) continue;

                if (photosData.some(p => p.name === file.name)) {
                    skippedCount++;
                    continue;
                }

                const photoId = 'photo_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
                const objectURL = URL.createObjectURL(file);

                let lat = null, lon = null, fechaStr = "Desconocida", azimuth = null;

                try {
                    const gps = await exifr.gps(file);
                    if (gps && gps.latitude && gps.longitude) {
                        lat = gps.latitude;
                        lon = gps.longitude;
                    }

                    const exifData = await exifr.parse(file, ['DateTimeOriginal', 'GPSImgDirection']);
                    if (exifData && exifData.DateTimeOriginal) {
                        fechaStr = new Date(exifData.DateTimeOriginal).toLocaleString('es-ES');
                    } else {
                        fechaStr = parseDateFromFilename(file.name);
                    }

                    if (exifData && exifData.GPSImgDirection !== undefined) {
                        azimuth = parseFloat(exifData.GPSImgDirection);
                    }
                } catch (err) {
                    console.warn(`Error leyendo EXIF en ${file.name}:`, err);
                    fechaStr = parseDateFromFilename(file.name);
                }

                const photoObj = {
                    id: photoId,
                    name: file.name,
                    url: objectURL,
                    lat: lat,
                    lon: lon,
                    azimuth: azimuth,
                    date: fechaStr,
                    hasGps: lat !== null && lon !== null,
                    marker: null
                };

                if (photoObj.hasGps) {
                    const marker = createCustomMarker(photoObj);
                    photoObj.marker = marker;
                    markersGroup.addLayer(marker);
                }

                photosData.push(photoObj);
                addedCount++;
            }

            statusText.innerText = `Cargadas ${addedCount} fotos${skippedCount > 0 ? ` (${skippedCount} omitidas)` : ''}`;
            updateUI();

            if (markersGroup.getLayers().length > 0) {
                map.fitBounds(markersGroup.getBounds(), { padding: [40, 40] });
            }
        }

        function parseDateFromFilename(filename) {
            const match = filename.match(/(\d{4})(\d{2})(\d{2})[_\-](\d{2})(\d{2})(\d{2})/);
            if (match) {
                return `${match[3]}/${match[2]}/${match[1]} ${match[4]}:${match[5]}:${match[6]}`;
            }
            return "Sin fecha EXIF";
        }

        // --- COPIAR COORDENADAS CON COLOR VERDE DINÁMICO ---
        function copyCoords(lat, lon, btnElement) {
            const text = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
            navigator.clipboard.writeText(text).then(() => {
                const originalContent = btnElement.innerHTML;
                const originalClass = btnElement.className;

                btnElement.innerHTML = `<i class="fa-solid fa-check text-emerald-600"></i> <span class="text-emerald-700 font-bold">Coordenadas copiadas al portapapeles</span>`;
                btnElement.className = `w-full mt-1 px-2 py-1.5 bg-emerald-50 text-emerald-700 text-[11px] font-semibold rounded border border-emerald-300 transition flex items-center justify-center gap-1.5`;

                setTimeout(() => {
                    btnElement.innerHTML = originalContent;
                    btnElement.className = originalClass;
                }, 2000);
            });
        }

        // --- ELIMINAR FOTOGRAFÍA ESPECÍFICA ---
        function deletePhoto(id) {
            const index = photosData.findIndex(p => p.id === id);
            if (index === -1) return;

            const photo = photosData[index];
            URL.revokeObjectURL(photo.url);

            if (photo.marker) {
                markersGroup.removeLayer(photo.marker);
            }

            photosData.splice(index, 1);
            updateUI();
            statusText.innerText = 'Fotografía eliminada';

            if (markersGroup.getLayers().length > 0) {
                map.fitBounds(markersGroup.getBounds(), { padding: [40, 40] });
            } else {
                map.setView([40.4168, -3.7038], 6);
            }
        }

        // --- CREAR MARCADOR PERSONALIZADO ---
        function createCustomMarker(photo) {
            const hasAzimuth = photo.azimuth !== null && !isNaN(photo.azimuth);
            const rotation = hasAzimuth ? photo.azimuth : 0;

            const customIcon = L.divIcon({
                className: 'custom-marker',
                html: `<div class="custom-marker-arrow-wrapper" style="transform: rotate(${rotation}deg);">
                        <div class="custom-marker-arrow-inner">
                            <i class="fa-solid fa-location-arrow"></i>
                        </div>
                       </div>`,
                iconSize: [36, 36],
                iconAnchor: [18, 18]
            });

            const marker = L.marker([photo.lat, photo.lon], { icon: customIcon });

            // Preview grande en Hover
            const tooltipContent = `
                <div class="text-center p-1">
                    <img src="${photo.url}" class="w-64 h-auto max-h-48 object-contain rounded mb-1 shadow bg-black/5">
                    <p class="font-semibold text-xs truncate max-w-[220px]">${photo.name}</p>
                </div>
            `;
            marker.bindTooltip(tooltipContent, {
                direction: 'top',
                offset: [0, -12],
                opacity: 0.95
            });

            // Popup grande con imagen completa sin recortar
            const popupContent = `
                <div class="p-2 text-slate-800 text-left min-w-[300px]">
                    <img src="${photo.url}" class="w-full h-auto max-h-64 object-contain rounded-lg shadow cursor-pointer mb-2 bg-black/5 hover:opacity-90 transition" onclick="openLightboxById('${photo.id}')">
                    <h4 class="font-bold text-xs truncate mb-1" title="${photo.name}">${photo.name}</h4>
                    <p class="text-[11px] text-slate-500 mb-1"><i class="fa-regular fa-clock mr-1"></i>${photo.date}</p>
                    ${hasAzimuth ? `<p class="text-[11px] text-slate-500 mb-1"><i class="fa-solid fa-compass mr-1"></i>Azimut: ${Math.round(photo.azimuth)}°</p>` : ''}
                    <button onclick="copyCoords(${photo.lat}, ${photo.lon}, this)" class="w-full mt-1 px-2 py-1.5 bg-brand-50 hover:bg-brand-100 text-brand-700 text-[11px] font-semibold rounded border border-brand-200 transition flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-copy"></i>
                        <span>${photo.lat.toFixed(6)}, ${photo.lon.toFixed(6)}</span>
                    </button>
                </div>
            `;
            marker.bindPopup(popupContent, { maxWidth: 350 });

            marker.on('mouseover', () => highlightItem(photo.id, true));
            marker.on('mouseout', () => highlightItem(photo.id, false));
            marker.on('click', () => focusPhoto(photo.id, false));

            return marker;
        }

        // --- ACTUALIZAR UI ---
        function updateUI() {
            const query = searchInput.value.toLowerCase();
            const filteredPhotos = photosData.filter(p => p.name.toLowerCase().includes(query) || p.date.toLowerCase().includes(query));

            itemsContainer.innerHTML = '';

            if (photosData.length === 0) {
                emptyState.classList.remove('hidden');
                btnExportGeoJSON.disabled = true;
                btnExportDXF.disabled = true;
                btnReset.disabled = true;
                counterBadge.innerText = '0 fotos';
                gpsStats.innerText = '0 con GPS';
                return;
            }

            emptyState.classList.add('hidden');
            btnExportGeoJSON.disabled = false;
            btnExportDXF.disabled = false;
            btnReset.disabled = false;

            const gpsCount = photosData.filter(p => p.hasGps).length;
            counterBadge.innerText = `${photosData.length} fotos`;
            gpsStats.innerText = `${gpsCount} con GPS`;

            filteredPhotos.forEach(photo => {
                const card = document.createElement('div');
                card.id = `card-${photo.id}`;
                card.className = `item-card p-2 bg-white rounded-lg border border-slate-200 shadow-sm hover:shadow flex gap-3 items-center cursor-pointer relative overflow-hidden`;

                card.innerHTML = `
                    <img src="${photo.url}" class="w-14 h-14 object-cover rounded-md flex-shrink-0 bg-slate-200 cursor-pointer" onclick="openLightboxById('${photo.id}')">
                    <div class="flex-1 min-w-0">
                        <p class="font-semibold text-xs text-slate-800 truncate">${photo.name}</p>
                        <p class="text-[10px] text-slate-500 mt-0.5"><i class="fa-regular fa-clock mr-1"></i>${photo.date}</p>
                        ${photo.hasGps 
                            ? `<p class="text-[10px] text-brand-600 font-medium mt-0.5"><i class="fa-solid fa-location-dot mr-1"></i>${photo.lat.toFixed(4)}, ${photo.lon.toFixed(4)}</p>` 
                            : `<p class="text-[10px] text-red-400 font-medium mt-0.5"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Sin datos GPS</p>`}
                    </div>
                    <div class="flex items-center gap-1">
                        ${photo.hasGps ? `
                            <button class="p-2 text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-full transition" title="Centrar en mapa y hacer zoom" onclick="event.stopPropagation(); focusPhoto('${photo.id}', true)">
                                <i class="fa-solid fa-crosshairs text-xs"></i>
                            </button>
                        ` : ''}
                        <button class="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-full transition" title="Eliminar fotografía" onclick="event.stopPropagation(); deletePhoto('${photo.id}')">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>
                `;

                card.addEventListener('mouseenter', () => highlightItem(photo.id, true));
                card.addEventListener('mouseleave', () => highlightItem(photo.id, false));
                card.addEventListener('click', (e) => {
                    if (!e.target.closest('button') && !e.target.closest('img')) {
                        focusPhoto(photo.id, true);
                    }
                });

                itemsContainer.appendChild(card);
            });
        }

        function highlightItem(id, isHighlight) {
            const photo = photosData.find(p => p.id === id);
            if (!photo) return;

            const card = document.getElementById(`card-${id}`);
            if (card) {
                if (isHighlight) card.classList.add('highlighted');
                else card.classList.remove('highlighted');
            }

            if (photo.marker && photo.marker.getElement()) {
                const element = photo.marker.getElement();
                if (isHighlight) element.classList.add('active');
                else element.classList.remove('active');
            }
        }

        // --- ENFOCAR FOTO (Aproxima a Zoom 18 y despliega popup) ---
        function focusPhoto(id, openPopup = true) {
            const photo = photosData.find(p => p.id === id);
            if (!photo || !photo.hasGps) return;

            map.flyTo([photo.lat, photo.lon], 18, { animate: true, duration: 1.0 });

            if (openPopup && photo.marker) {
                setTimeout(() => {
                    photo.marker.openPopup();
                }, 1000);
            }

            const card = document.getElementById(`card-${id}`);
            if (card) {
                card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        // --- GESTIÓN DEL LIGHTBOX Y ZOOM CON LUPA ---
        function openLightboxById(id) {
            const index = photosData.findIndex(p => p.id === id);
            if (index !== -1) showLightbox(index);
        }

        function showLightbox(index) {
            if (index < 0 || index >= photosData.length) return;
            currentLightboxIndex = index;
            const photo = photosData[index];

            resetLbZoom();

            lightboxImg.src = photo.url;
            lightboxTitle.innerText = photo.name;
            lightboxSub.innerText = photo.hasGps 
                ? `${photo.date} | GPS: ${photo.lat.toFixed(5)}, ${photo.lon.toFixed(5)}` 
                : `${photo.date} | Sin coordenadas GPS`;
            lightboxIndex.innerText = `${index + 1} / ${photosData.length}`;

            lightbox.classList.remove('hidden');
            setTimeout(() => lightbox.classList.add('opacity-100'), 10);
        }

        function closeLightbox() {
            lightbox.classList.remove('opacity-100');
            setTimeout(() => {
                lightbox.classList.add('hidden');
                resetLbZoom();
                // Al salir del lightbox tras navegar, enfocar última foto visitada
                const currentPhoto = photosData[currentLightboxIndex];
                if (currentPhoto && currentPhoto.hasGps) {
                    focusPhoto(currentPhoto.id, true);
                }
            }, 300);
        }

        function updateLbTransform() {
            lightboxImg.style.transform = `scale(${lbScale}) translate(${lbPosX}px, ${lbPosY}px)`;
            lbZoomLevel.innerText = `${Math.round(lbScale * 100)}%`;
        }

        function resetLbZoom() {
            lbScale = 1;
            lbPosX = 0;
            lbPosY = 0;
            updateLbTransform();
        }

        lbZoomIn.addEventListener('click', () => { lbScale = Math.min(lbScale + 0.5, 5); updateLbTransform(); });
        lbZoomOut.addEventListener('click', () => { lbScale = Math.max(lbScale - 0.5, 0.5); updateLbTransform(); });
        lbZoomReset.addEventListener('click', resetLbZoom);

        // Arrastrar imagen ampliada en Lightbox
        lightboxContainer.addEventListener('mousedown', (e) => {
            if (lbScale > 1) {
                isDragging = true;
                startX = e.clientX - lbPosX;
                startY = e.clientY - lbPosY;
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            lbPosX = e.clientX - startX;
            lbPosY = e.clientY - startY;
            updateLbTransform();
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        // Clic en imagen hace zoom toggle
        lightboxImg.addEventListener('click', (e) => {
            e.stopPropagation();
            if (lbScale === 1) {
                lbScale = 2.5;
            } else {
                resetLbZoom();
            }
            updateLbTransform();
        });

        lightboxClose.addEventListener('click', closeLightbox);
        lightboxPrev.addEventListener('click', () => showLightbox(currentLightboxIndex - 1));
        lightboxNext.addEventListener('click', () => showLightbox(currentLightboxIndex + 1));

        document.addEventListener('keydown', (e) => {
            if (lightbox.classList.contains('hidden')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') showLightbox(currentLightboxIndex - 1);
            if (e.key === 'ArrowRight') showLightbox(currentLightboxIndex + 1);
        });

        searchInput.addEventListener('input', updateUI);

        // --- EXPORTAR A GEOJSON ---
        btnExportGeoJSON.addEventListener('click', () => {
            const features = photosData.filter(p => p.hasGps).map(p => ({
                type: "Feature",
                geometry: {
                    type: "Point",
                    coordinates: [p.lon, p.lat]
                },
                properties: {
                    nombre: p.name,
                    fecha: p.date,
                    azimuth: p.azimuth
                }
            }));

            const geojson = { type: "FeatureCollection", features: features };
            const blob = new Blob([JSON.stringify(geojson, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `inspeccion_geolocalizada_${Date.now()}.geojson`;
            a.click();
            URL.revokeObjectURL(url);
        });

        // --- EXPORTAR A DXF (AutoCAD) ---
        btnExportDXF.addEventListener('click', () => {
            const validPhotos = photosData.filter(p => p.hasGps);
            if (validPhotos.length === 0) return;

            const firstGps = validPhotos[0];
            const utmZone = Math.floor((firstGps.lon + 180) / 6) + 1;
            const isNorthern = firstGps.lat >= 0;
            const utmProjStr = `+proj=utm +zone=${utmZone} ${isNorthern ? '' : '+south'} +datum=WGS84 +units=m +no_defs`;

            let dxf = [];
            dxf.push("0\nSECTION\n2\nHEADER\n0\nENDSEC");
            dxf.push("0\nSECTION\n2\nTABLES\n0\nENDSEC");
            dxf.push("0\nSECTION\n2\nBLOCKS\n0\nENDSEC");
            dxf.push("0\nSECTION\n2\nENTITIES");

            validPhotos.forEach(photo => {
                const [xUtm, yUtm] = proj4('WGS84', utmProjStr, [photo.lon, photo.lat]);

                const azimuth = (photo.azimuth !== null && !isNaN(photo.azimuth)) ? photo.azimuth : 0;
                const cadAngleRad = ((90 - azimuth) * Math.PI) / 180;

                const arrowLength = 5.0;
                const xTarget = xUtm + arrowLength * Math.cos(cadAngleRad);
                const yTarget = yUtm + arrowLength * Math.sin(cadAngleRad);

                // Círculo base
                dxf.push(`0\nCIRCLE\n8\nFOTOS_PUNTOS\n10\n${xUtm.toFixed(3)}\n20\n${yUtm.toFixed(3)}\n30\n0.0\n40\n0.8`);

                // Flecha acimut
                dxf.push(`0\nLINE\n8\nFOTOS_AZIMUT\n10\n${xUtm.toFixed(3)}\n20\n${yUtm.toFixed(3)}\n30\n0.0\n11\n${xTarget.toFixed(3)}\n21\n${yTarget.toFixed(3)}\n31\n0.0`);

                // Texto Nombre
                dxf.push(`0\nTEXT\n8\nFOTOS_TEXTO\n10\n${(xUtm + 1.2).toFixed(3)}\n20\n${(yUtm + 1.2).toFixed(3)}\n30\n0.0\n40\n1.2\n1\n${photo.name}`);
                
                // Texto Fecha y Azimut
                dxf.push(`0\nTEXT\n8\nFOTOS_TEXTO\n10\n${(xUtm + 1.2).toFixed(3)}\n20\n${(yUtm - 0.5).toFixed(3)}\n30\n0.0\n40\n0.8\n1\nAz: ${Math.round(azimuth)}° | ${photo.date}`);
            });

            dxf.push("0\nENDSEC\n0\nEOF");

            const blob = new Blob([dxf.join("\n")], { type: "application/dxf" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `inspeccion_UTM_Zona${utmZone}N_${Date.now()}.dxf`;
            a.click();
            URL.revokeObjectURL(url);
        });

        // --- RESETEAR / LIMPIAR TODO ---
        btnReset.addEventListener('click', () => {
            if (!confirm("¿Deseas borrar todas las fotos cargadas?")) return;
            photosData.forEach(p => URL.revokeObjectURL(p.url));
            photosData = [];
            markersGroup.clearLayers();
            updateUI();
            statusText.innerText = 'Lista limpiada';
            map.setView([40.4168, -3.7038], 6);
        });

        // --- RECENTRAR MAPA ---
        btnCenterMap.addEventListener('click', () => {
            if (markersGroup.getLayers().length > 0) {
                map.fitBounds(markersGroup.getBounds(), { padding: [40, 40] });
            } else {
                map.setView([40.4168, -3.7038], 6);
            }
        });
    </script>
</body>
</html>
