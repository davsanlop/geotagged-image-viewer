<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor Geospacial de Inspección</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Librería Exifr para EXIF y GPS -->
    <script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>
    <!-- Plugin Leaflet RotatedMarker para el icono de Azimut -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet-rotatedmarker@0.2.2/leaflet.rotatedMarker.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            font-family: Arial, sans-serif;
            display: flex; height: 100vh;
            background: #f0f2f5; color: #333;
        }
        #sidebar {
            width: 360px;
            background: #ffffff;
            border-right: 1px solid #ccc;
            display: flex; flex-direction: column;
            z-index: 1000; shadow: 2px 0 5px rgba(0,0,0,0.1);
        }
        #map { flex-grow: 1; height: 100%; }
        
        .header {
            padding: 15px 20px;
            background: #007bff; color: white;
        }
        .header h2 { margin: 0 0 5px 0; font-size: 18px; }
        .header p { margin: 0; font-size: 12px; opacity: 0.9; }

        #drop-zone {
            margin: 15px;
            border: 2px dashed #007bff;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            background: #f8f9fa;
            color: #555;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        #drop-zone.dragover {
            background: #e2e8f0; border-color: #0056b3;
        }

        .search-box { padding: 0 15px 10px 15px; }
        .search-box input {
            width: 100%; padding: 8px 10px; font-size: 12px;
            border: 1px solid #ccc; border-radius: 4px; outline: none;
        }

        #file-list {
            flex-grow: 1; overflow-y: auto; padding: 0 15px 15px 15px;
        }
        .photo-card {
            display: flex; align-items: center; gap: 10px;
            padding: 8px; margin-bottom: 8px;
            background: #f8f9fa; border: 1px solid #e9ecef;
            border-radius: 6px; cursor: pointer; transition: all 0.15s ease;
        }
        .photo-card:hover, .photo-card.active {
            background: #e7f1ff; border-color: #70aceb;
        }
        .photo-card img {
            width: 48px; height: 48px; object-fit: cover; border-radius: 4px;
        }
        .photo-info { flex-grow: 1; min-width: 0; }
        .photo-info .name { font-size: 12px; font-weight: bold; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
        .photo-info .date { font-size: 10px; color: #6c757d; margin-top: 2px; }
        .photo-info .azimuth { font-size: 10px; color: #007bff; font-weight: bold; margin-top: 2px; }

        .footer { padding: 12px 15px; border-top: 1px solid #ddd; background: #fafafa; }
        .btn-export {
            width: 100%; padding: 8px; background: #28a745; color: white;
            border: none; border-radius: 4px; font-size: 12px; font-weight: bold;
            cursor: pointer; display: none;
        }
        .btn-export:hover { background: #218838; }

        /* Popups del Mapa */
        .leaflet-popup-content-wrapper { padding: 5px; border-radius: 6px; }
        .popup-card { width: 220px; font-size: 12px; }
        .popup-card b { color: #007bff; display: block; margin-bottom: 4px; }
        .popup-card img {
            width: 100%; height: 130px; object-fit: cover; border-radius: 4px;
            margin: 6px 0; cursor: pointer;
        }
        .btn-copy {
            width: 100%; padding: 5px; background: #007bff; color: white;
            border: none; border-radius: 3px; font-size: 11px; cursor: pointer;
            margin-top: 4px; font-weight: bold;
        }
        .btn-copy:hover { background: #0056b3; }

        /* Lightbox */
        #lightbox {
            display: none; position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.85); z-index: 9999;
            flex-direction: column; align-items: center; justify-content: center;
        }
        #lightbox img {
            max-width: 90vw; max-height: 85vh; object-fit: contain; border-radius: 6px;
        }
        #lightbox .caption {
            color: white; margin-top: 10px; font-size: 13px; font-weight: bold;
        }
        #lightbox .close {
            position: absolute; top: 15px; right: 25px; color: white;
            font-size: 30px; cursor: pointer; font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header">
            <h2>Visor de Fotos GeoEXIF</h2>
            <p>Arrastra tus fotos para posicionarlas en el mapa</p>
        </div>

        <div id="drop-zone">
            📁 <b>Arrastra tus fotos JPG aquí</b><br>
            <span style="font-size: 11px;">o haz clic para seleccionarlas</span>
            <input type="file" id="file-input" multiple accept="image/jpeg, image/jpg" style="display: none;">
        </div>

        <div class="search-box">
            <input type="text" id="search-input" placeholder="🔍 Filtrar por nombre o fecha...">
        </div>

        <div id="file-list">
            <div style="text-align: center; color: #aaa; font-size: 12px; padding-top: 30px;">
                No hay imágenes cargadas.
            </div>
        </div>

        <div class="footer">
            <button id="btn-export" class="btn-export">📥 Exportar a GeoJSON</button>
        </div>
    </div>

    <div id="map"></div>

    <div id="lightbox" onclick="closeLightbox()">
        <span class="close">&times;</span>
        <img id="lightbox-img" src="" alt="Foto">
        <div id="lightbox-caption" class="caption"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const map = L.map('map').setView([40.4168, -3.7038], 6);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const markersLayer = L.layerGroup().addTo(map);
        let photosData = [];

        // SVG personalizado para la flecha de Azimut / Rumbo
        const arrowSvg = `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
                <circle cx="16" cy="16" r="14" fill="#007bff" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
                <path d="M16 4 L23 24 L16 19 L9 24 Z" fill="#ffffff"/>
            </svg>`;
        
        const arrowIcon = L.divIcon({
            html: arrowSvg,
            className: '',
            iconSize: [32, 32],
            iconAnchor: [16, 16],
            popupAnchor: [0, -16]
        });

        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileList = document.getElementById('file-list');
        const searchInput = document.getElementById('search-input');
        const btnExport = document.getElementById('btn-export');

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
        searchInput.addEventListener('input', renderList);

        function extraerFechaDeNombre(filename) {
            const match = filename.match(/(\d{8})_(\d{6})/);
            if (match) {
                const f = match[1], h = match[2];
                return `${f.slice(0,4)}-${f.slice(4,6)}-${f.slice(6,8)} ${h.slice(0,2)}:${h.slice(2,4)}:${h.slice(4,6)}`;
            }
            return "Fecha desconocida";
        }

        async function handleFiles(files) {
            let bounds = [];

            for (let file of files) {
                if (!file.type.match('image/jpeg') && !file.name.match(/\.(jpg|jpeg)$/i)) continue;

                try {
                    const exifData = await exifr.parse(file, { gps: true, pick: ['GPSImgDirection', 'GPSDestBearing'] });
                    const gps = await exifr.gps(file);

                    if (gps && gps.latitude && gps.longitude) {
                        const lat = gps.latitude;
                        const lon = gps.longitude;
                        const fecha = extraerFechaDeNombre(file.name);
                        const azimut = exifData?.GPSImgDirection || exifData?.GPSDestBearing || null;
                        const objectURL = URL.createObjectURL(file);

                        const item = {
                            id: 'photo-' + Math.random().toString(36).substr(2, 9),
                            name: file.name,
                            lat: lat,
                            lon: lon,
                            fecha: fecha,
                            azimut: azimut !== null ? Math.round(azimut) : null,
                            url: objectURL
                        };

                        photosData.push(item);
                        bounds.push([lat, lon]);
                        createMarker(item);
                    }
                } catch (err) {
                    console.error("Error leyendo metadatos:", err);
                }
            }

            if (bounds.length > 0) {
                map.fitBounds(bounds, { padding: [50, 50] });
                btnExport.style.display = 'block';
                renderList();
            }
        }

        function createMarker(item) {
            let markerOptions = {};
            
            // Si incluye Azimut, aplicamos el icono flecha rotado con Leaflet.RotatedMarker
            if (item.azimut !== null) {
                markerOptions = {
                    icon: arrowIcon,
                    rotationAngle: item.azimut,
                    rotationOrigin: 'center center'
                };
            }

            const marker = L.marker([item.lat, item.lon], markerOptions).addTo(markersLayer);

            // 1. Hover tooltip
            marker.bindTooltip(`<b>${item.name}</b><br>${item.fecha}`, {
                direction: 'top',
                offset: [0, -10]
            });

            // 2. Popup al hacer clic (Sin alterar el zoom del mapa)
            const popupHtml = `
                <div class="popup-card">
                    <b>${item.name}</b>
                    <div>📅 ${item.fecha}</div>
                    <div>📍 ${item.lat.toFixed(6)}, ${item.lon.toFixed(6)}</div>
                    ${item.azimut !== null ? `<div>🧭 Azimut: ${item.azimut}°</div>` : ''}
                    <img src="${item.url}" onclick="openLightbox('${item.url}', '${item.name}')" alt="Foto">
                    <button class="btn-copy" onclick="copiarCoordenadas(${item.lat}, ${item.lon})">📋 Copiar Coordenadas</button>
                </div>
            `;
            marker.bindPopup(popupHtml);

            // Efecto Hover Bidireccional
            marker.on('mouseover', () => {
                const card = document.getElementById(item.id);
                if (card) card.classList.add('active');
            });
            marker.on('mouseout', () => {
                const card = document.getElementById(item.id);
                if (card) card.classList.remove('active');
            });

            item.marker = marker;
        }

        function renderList() {
            const query = searchInput.value.toLowerCase();
            fileList.innerHTML = '';

            const filtered = photosData.filter(p => p.name.toLowerCase().includes(query) || p.fecha.toLowerCase().includes(query));

            if (filtered.length === 0) {
                fileList.innerHTML = `<div style="text-align: center; color: #aaa; font-size: 12px; padding-top: 30px;">No se encontraron resultados.</div>`;
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.id = item.id;
                card.className = 'photo-card';
                card.innerHTML = `
                    <img src="${item.url}" onclick="event.stopPropagation(); openLightbox('${item.url}', '${item.name}')">
                    <div class="photo-info">
                        <div class="name" title="${item.name}">${item.name}</div>
                        <div class="date">${item.fecha}</div>
                        ${item.azimut !== null ? `<div class="azimuth">🧭 Azimut: ${item.azimut}°</div>` : ''}
                    </div>
                `;

                card.addEventListener('click', () => {
                    // Mantiene el nivel de zoom actual o establece zoom 18 si es lejano
                    const currentZoom = map.getZoom();
                    map.setView([item.lat, item.lon], Math.max(currentZoom, 17));
                    item.marker.openPopup();
                });

                fileList.appendChild(card);
            });
        }

        function copiarCoordenadas(lat, lon) {
            const texto = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
            navigator.clipboard.writeText(texto).then(() => {
                alert(`Coordenadas copiadas al portapapeles:\n${texto}`);
            });
        }

        function openLightbox(url, caption) {
            document.getElementById('lightbox-img').src = url;
            document.getElementById('lightbox-caption').innerText = caption;
            document.getElementById('lightbox').style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });

        btnExport.addEventListener('click', () => {
            const features = photosData.map(p => ({
                type: "Feature",
                geometry: {
                    type: "Point",
                    coordinates: [p.lon, p.lat]
                },
                properties: {
                    archivo: p.name,
                    fecha: p.fecha,
                    azimut: p.azimut
                }
            }));

            const geojson = { type: "FeatureCollection", features: features };
            const blob = new Blob([JSON.stringify(geojson, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "inspeccion_fotos.geojson";
            a.click();
        });
    </script>
</body>
</html>
