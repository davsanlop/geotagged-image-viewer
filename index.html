<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor Geospacial Autónomo - Exif & Map</title>
    
    <!-- Leaflet CSS para el mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Librería Exifr para leer metadatos EXIF/GPS en el navegador -->
    <script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            background: #f0f2f5;
        }
        #sidebar {
            width: 350px;
            background: #fff;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }
        #map {
            flex-grow: 1;
            height: 100%;
        }
        .header {
            padding: 20px;
            background: #007bff;
            color: white;
        }
        .header h2 { margin: 0 0 5px 0; font-size: 18px; }
        .header p { margin: 0; font-size: 12px; opacity: 0.8; }
        
        #drop-zone {
            margin: 15px;
            border: 2px dashed #007bff;
            border-radius: 8px;
            padding: 25px;
            text-align: center;
            background: #f8f9fa;
            color: #555;
            cursor: pointer;
            transition: background 0.2s;
        }
        #drop-zone.dragover {
            background: #e2e8f0;
            border-color: #0056b3;
        }
        #file-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 0 15px 15px 15px;
        }
        .photo-item {
            padding: 8px 10px;
            margin-bottom: 8px;
            background: #f1f3f5;
            border-radius: 4px;
            font-size: 12px;
            border-left: 4px solid #28a745;
        }
        .photo-item.error {
            border-left-color: #dc3545;
            color: #721c24;
        }
        /* Estilos del Pop-up del mapa */
        .leaflet-popup-content img {
            max-width: 200px;
            border-radius: 4px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header">
            <h2>Visor de Fotos GeoEXIF</h2>
            <p>Arrastra tus fotos de SharePoint/Local aquí</p>
        </div>

        <div id="drop-zone">
            📁 <b>Arrastra tus fotos JPG aquí</b><br>
            <span style="font-size: 11px;">o haz clic para seleccionarlas</span>
            <input type="file" id="file-input" multiple accept="image/jpeg, image/jpg" style="display: none;">
        </div>

        <div style="padding: 0 15px; font-size: 12px; font-weight: bold; color: #333;">Registro de procesamiento:</div>
        <div id="file-list"></div>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Inicializar el Mapa centrado por defecto en España (ajustable)
        const map = L.map('map').setView([40.4168, -3.7038], 6);

        // Capa base de OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const markersLayer = L.layerGroup().addTo(map);
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileList = document.getElementById('file-list');

        // Eventos de arrastrar y soltar
        dropZone.addEventListener('click', () => fileInput.click());
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        async function handleFiles(files) {
            let bounds = [];

            for (let file of files) {
                if (!file.type.match('image/jpeg') && !file.name.match(/\.(jpg|jpeg)$/i)) continue;

                try {
                    // Extraer metadatos EXIF y GPS usando la librería exifr
                    const gps = await exifr.gps(file);
                    const datetime = await exifr.string(file, 'DateTimeOriginal');

                    if (gps && gps.latitude && gps.longitude) {
                        const lat = gps.latitude;
                        const lon = gps.longitude;
                        const fecha = datetime || "Fecha desconocida";

                        // Crear URL temporal local (blob) para previsualizar la foto en el navegador
                        const objectURL = URL.createObjectURL(file);

                        // Añadir marcador al mapa
                        const marker = L.marker([lat, lon]).addTo(markersLayer);
                        marker.bindPopup(`
                            <b>${file.name}</b><br>
                            <small>📅 ${fecha}</small><br>
                            <img src="${objectURL}" alt="Foto inspección">
                        `);

                        bounds.push([lat, lon]);

                        // Registrar en la barra lateral
                        addLog(`✅ ${file.name} procesada con éxito.`, false);
                    } else {
                        addLog(`⚠️ ${file.name}: Sin datos GPS en EXIF.`, true);
                    }
                } catch (error) {
                    addLog(`❌ Error leyendo ${file.name}: ${error.message}`, true);
                }
            }

            // Ajustar el zoom del mapa para encuadrar las nuevas fotos añadidas
            if (bounds.length > 0) {
                map.fitBounds(bounds, { padding: [50, 50] });
            }
        }

        function addLog(text, isError) {
            const div = document.createElement('div');
            div.className = isError ? 'photo-item error' : 'photo-item';
            div.innerText = text;
            fileList.prepend(div);
        }
    </script>
</body>
</html>
