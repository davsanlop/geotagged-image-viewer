<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor Geospacial Autónomo - Inspecciones</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería Exifr para EXIF/GPS -->
    <script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>

    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        /* Lightbox adaptado para no salir de pantalla */
        #lightbox-modal img {
            max-width: 90vw;
            max-height: 85vh;
            object-fit: contain;
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex overflow-hidden">

    <!-- PANEL LATERAL -->
    <div class="w-96 bg-white shadow-xl flex flex-col z-20">
        <div class="p-4 bg-blue-600 text-white">
            <h1 class="text-lg font-bold">Visor de Inspección GeoEXIF</h1>
            <p class="text-xs text-blue-100">Arrastra tus fotos de SharePoint o locales</p>
        </div>

        <!-- Zona de Drag & Drop -->
        <div id="drop-zone" class="m-4 border-2 border-dashed border-blue-400 rounded-lg p-6 text-center bg-blue-50 hover:bg-blue-100 cursor-pointer transition">
            📁 <b class="text-sm text-blue-700">Arrastra tus fotos aquí</b><br>
            <span class="text-xs text-gray-500">o haz clic para buscarlas</span>
            <input type="file" id="file-input" multiple accept="image/jpeg, image/jpg" class="hidden">
        </div>

        <!-- Buscador / Filtro -->
        <div class="px-4 mb-2">
            <input type="text" id="search-input" placeholder="🔍 Filtrar por nombre o fecha..." class="w-full px-3 py-2 text-xs border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Listado de Fotos -->
        <div class="flex-1 overflow-y-auto px-4 pb-4 space-y-2" id="file-list">
            <div class="text-center text-gray-400 text-xs py-8">No hay imágenes cargadas.</div>
        </div>

        <!-- Exportar GeoJSON -->
        <div class="p-4 border-t bg-gray-50">
            <button id="btn-export" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2 px-4 rounded transition hidden">
                📥 Descargar GeoJSON
            </button>
        </div>
    </div>

    <!-- MAPA -->
    <div id="map" class="flex-1 h-full z-10"></div>

    <!-- LIGHTBOX MODAL -->
    <div id="lightbox-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex flex-col items-center justify-center p-4">
        <button onclick="closeLightbox()" class="absolute top-4 right-6 text-white text-3xl font-bold hover:text-gray-300">&times;</button>
        <img id="lightbox-img" class="rounded-lg shadow-2xl mb-3" src="" alt="Ampliación">
        <p id="lightbox-caption" class="text-white text-sm font-semibold bg-black/50 px-4 py-1 rounded-full"></p>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const map = L.map('map').setView([40.4168, -3.7038], 6);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const markersLayer = L.layerGroup().addTo(map);
        let loadedPhotos = [];

        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileList = document.getElementById('file-list');
        const searchInput = document.getElementById('search-input');
        const btnExport = document.getElementById('btn-export');

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('bg-blue-100'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('bg-blue-100'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('bg-blue-100');
            handleFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        searchInput.addEventListener('input', renderPhotoList);

        function extraerFechaDeNombre(filename) {
            const match = filename.match(/(\d{8})_(\d{6})/);
            if (match) {
                const f = match[1], h = match[2];
                return `${f.slice(0,4)}-${f.slice(4,6)}-${f.slice(6,8)} ${h.slice(0,2)}:${h.slice(2,4)}:${h.slice(4,6)}`;
            }
            return "Fecha desconocida";
        }

        async function handleFiles(files) {
            let bounds = [];

            for (let file of files) {
                if (!file.type.match('image/jpeg') && !file.name.match(/\.(jpg|jpeg)$/i)) continue;

                try {
                    // Extraer GPS y Azimut (GPSImgDirection)
                    const exifData = await exifr.parse(file, { gps: true, pick: ['GPSImgDirection', 'GPSDestBearing'] });
                    const gps = await exifr.gps(file);

                    if (gps && gps.latitude && gps.longitude) {
                        const lat = gps.latitude;
                        const lon = gps.longitude;
                        const fecha = extraerFechaDeNombre(file.name);
                        const azimut = exifData?.GPSImgDirection || exifData?.GPSDestBearing || null;
                        const objectURL = URL.createObjectURL(file);

                        const photoObj = {
                            name: file.name,
                            lat: lat,
                            lon: lon,
                            fecha: fecha,
                            azimut: azimut ? Math.round(azimut) : null,
                            url: objectURL,
                            file: file
                        };

                        loadedPhotos.push(photoObj);
                        bounds.push([lat, lon]);
                        addMarkerToMap(photoObj);
                    }
                } catch (error) {
                    console.error(`Error leyendo ${file.name}:`, error);
                }
            }

            if (bounds.length > 0) {
                map.fitBounds(bounds, { padding: [50, 50] });
                btnExport.classList.remove('hidden');
                renderPhotoList();
            }
        }

        function addMarkerToMap(photo) {
            const marker = L.marker([photo.lat, photo.lon]).addTo(markersLayer);

            // 1. Tooltip al pasar el ratón (Hover)
            marker.bindTooltip(`<b>${photo.name}</b><br><small>${photo.fecha}</small>`, {
                direction: 'top',
                offset: [0, -10],
                opacity: 0.9
            });

            // 2. Popup detallado al hacer clic (Mantiene el zoom uniforme)
            const popupContent = `
                <div class="p-1 max-w-xs">
                    <b class="text-blue-900 text-sm block mb-1">${photo.name}</b>
                    <div class="text-xs text-gray-600 mb-1">📅 ${photo.fecha}</div>
                    <div class="text-xs text-gray-600 mb-1">📍 ${photo.lat.toFixed(6)}, ${photo.lon.toFixed(6)}</div>
                    ${photo.azimut !== null ? `<div class="text-xs text-gray-600 mb-2">🧭 Azimut: ${photo.azimut}°</div>` : ''}
                    <img src="${photo.url}" class="w-full h-36 object-cover rounded-md cursor-pointer mb-2 hover:opacity-90 transition" onclick="openLightbox('${photo.url}', '${photo.name}')" alt="Foto">
                    <button onclick="copiarCoordenadas(${photo.lat}, ${photo.lon})" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-1 px-2 rounded transition">
                        📋 Copiar Coordenadas
                    </button>
                </div>
            `;
            marker.bindPopup(popupContent);

            // Sincronizar hover con la lista lateral
            marker.on('mouseover', () => {
                const el = document.getElementById(`card-${photo.name}`);
                if (el) el.classList.add('bg-blue-50', 'border-blue-400');
            });
            marker.on('mouseout', () => {
                const el = document.getElementById(`card-${photo.name}`);
                if (el) el.classList.remove('bg-blue-50', 'border-blue-400');
            });

            photo.marker = marker;
        }

        function renderPhotoList() {
            const query = searchInput.value.toLowerCase();
            fileList.innerHTML = '';

            const filtered = loadedPhotos.filter(p => p.name.toLowerCase().includes(query) || p.fecha.toLowerCase().includes(query));

            if (filtered.length === 0) {
                fileList.innerHTML = `<div class="text-center text-gray-400 text-xs py-8">No se encontraron resultados.</div>`;
                return;
            }

            filtered.forEach(photo => {
                const div = document.createElement('div');
                div.id = `card-${photo.name}`;
                div.className = "flex items-center gap-3 p-2 bg-gray-50 border border-gray-200 rounded-lg cursor-pointer hover:bg-blue-50 transition";
                div.innerHTML = `
                    <img src="${photo.url}" class="w-12 h-12 object-cover rounded shadow-sm" onclick="event.stopPropagation(); openLightbox('${photo.url}', '${photo.name}')">
                    <div class="flex-1 min-w-0">
                        <p class="text-xs font-bold text-gray-800 truncate">${photo.name}</p>
                        <p class="text-[10px] text-gray-500">${photo.fecha}</p>
                        ${photo.azimut !== null ? `<p class="text-[10px] text-blue-600 font-semibold">🧭 ${photo.azimut}°</p>` : ''}
                    </div>
                `;

                // Al hacer clic en la tarjeta del panel lateral, centra el mapa en el punto y abre su popup
                div.addEventListener('click', () => {
                    map.setView([photo.lat, photo.lon], 18);
                    photo.marker.openPopup();
                });

                fileList.appendChild(div);
            });
        }

        function copiarCoordenadas(lat, lon) {
            const texto = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
            navigator.clipboard.writeText(texto).then(() => {
                alert(`¡Coordenadas copiadas al portapapeles!\n${texto}`);
            });
        }

        function openLightbox(url, name) {
            document.getElementById('lightbox-img').src = url;
            document.getElementById('lightbox-caption').innerText = name;
            document.getElementById('lightbox-modal').classList.remove('hidden');
        }

        function closeLightbox() {
            document.getElementById('lightbox-modal').classList.add('hidden');
        }

        // Cerrar lightbox con tecla ESC
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });

        // Exportar a GeoJSON
        btnExport.addEventListener('click', () => {
            const features = loadedPhotos.map(p => ({
                type: "Feature",
                geometry: {
                    type: "Point",
                    coordinates: [p.lon, p.lat]
                },
                properties: {
                    archivo: p.name,
                    fecha: p.fecha,
                    azimut: p.azimut,
                    imagen_url: p.url
                }
            }));

            const geojson = { type: "FeatureCollection", features: features };
            const blob = new Blob([JSON.stringify(geojson, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "datos_inspeccion.geojson";
            a.click();
        });
    </script>
</body>
</html>
